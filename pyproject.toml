[project]
name = "weirdchat"
version = "0.1.0"
description = "Client code for working with the WeirdChat dataset of unexpected AI behaviors, with reference judge and reproduction of examples."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Transluce", email = "info@transluce.org" }]
dependencies = [
    "accelerate>=1.14.0",
    "anyio>=4",
    "docent-python>=0.1.74",
    "flask>=3.1.3",
    "huggingface_hub>=0.30",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "markdown>=3.10.3",
    "openai>=1.60",
    "pyarrow>=17",
    "pydantic>=2.7",
    "python-dotenv>=1.2.2",
    "safetensors>=0.8.0",
    "tabulate>=0.9.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.66",
    "transformer-lens>=3.8.0",
    "transformers>=5.16.1",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pyarrow-stubs>=20.0.0.20260625",
    "pyright>=1.1",
    "pytest>=8",
    "trio>=0.30",
]

[project.urls]
Homepage = "https://transluce.org/weirdchat"
Dataset = "https://huggingface.co/datasets/Transluce/WeirdChat"
Repository = "https://github.com/transluceAI/weirdchat"
Explorer = "https://weirdchat.transluce.org"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weirdchat"]

[tool.pyright]
typeCheckingMode = "basic"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
# Pin the classification so isort is deterministic regardless of whether weirdchat is installed
# (auto-detection otherwise differs between a dev machine and CI, causing spurious re-sorts).
known_first_party = ["weirdchat"]
