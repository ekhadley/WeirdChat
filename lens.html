<title>lens viewer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; background: #282828; color: #ebdbb2; font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; }
body { display: flex; flex-direction: column; }
.banner { display: flex; align-items: center; gap: 10px; background: #3c3836; border-bottom: 1px solid #504945; padding: 8px 16px; font-weight: bold; color: #fb4934; flex-shrink: 0; }
#status { color: #a89984; font-weight: normal; font-size: 13px; }
.panes { display: flex; flex: 1; min-height: 0; gap: 16px; padding: 12px 16px; }
#strip { flex: 1; min-width: 0; font-family: monospace; font-size: 17px; line-height: 1.5; overflow-y: auto; }
#right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
#toprow { display: flex; gap: 12px; flex: none; height: 28vh; }
#inputcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.controls { display: flex; align-items: center; gap: 8px; }
.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #928374; }
.lj { color: #83a598; } .lt { color: #d3869b; }
.hint, .where { font-weight: normal; text-transform: none; letter-spacing: 0; }
.hint { color: #665c54; }
.where { color: #ebdbb2; font-family: monospace; font-size: 13px; }
.kind { color: #665c54; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-family: -apple-system, 'Segoe UI', sans-serif; }
input, select, textarea, button { background: #1d2021; border: 1px solid #504945; color: #ebdbb2; border-radius: 3px; font-family: inherit; font-size: 13px; outline: none; }
input:focus, textarea:focus { border-color: #83a598; }
input, select { padding: 3px 8px; }
input[type=number] { width: 55px; }
input[type=range], input[type=checkbox] { accent-color: #fabd2f; border: none; background: none; padding: 0; }
input[type=range] { width: 45%; min-width: 300px; }
#tag, #pinsearch, textarea { width: 100%; }
#tag, textarea { font-family: monospace; }
textarea { flex: 1; min-height: 90px; padding: 8px; resize: none; }
button { background: #282828; color: #a89984; padding: 3px 14px; border-radius: 4px; cursor: pointer; user-select: none; }
button:hover { color: #ebdbb2; background: #504945; }
.tok { display: inline-block; vertical-align: top; cursor: pointer; }
.tok .txt { display: block; white-space: pre-wrap; padding: 2px 1px; }
.tok.alt .txt { background: #3c3836; }
.tok:not(.alt) .txt { background: #32302f; }
.tok:hover .txt { background: #504945; }
.tok.sel .txt { background: #fabd2f; color: #282828; }
.bar { height: 4px; }
.txt + .bar { margin-top: 2px; }
#layerbox { display: flex; align-items: center; gap: 10px; }
#layerval { color: #fabd2f; }
#tables { display: flex; gap: 20px; flex: 1; min-width: 0; min-height: 0; }
#tables > div { flex: 1; min-width: 0; overflow-y: auto; }
table { border-collapse: collapse; margin-top: 6px; width: 100%; table-layout: fixed; font-family: monospace; font-size: 13px; }
th, td { border: 1px solid #504945; padding: 1px 8px; text-align: left; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
th { background: #32302f; color: #928374; font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
tr.pinnable { cursor: pointer; }
tr.pinnable:hover td { background: #3c3836; }
tr.pinned td { border-top: 2px solid #504945; font-weight: bold; }
#pinbox { width: 340px; flex-shrink: 0; background: #1d2021; border: 1px solid #504945; border-radius: 4px; padding: 10px; overflow-y: auto; }
.pin { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-family: monospace; font-size: 13px; }
.pin .plabel { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swatch { width: 12px; height: 12px; flex-shrink: 0; border-radius: 2px; }
.rm { cursor: pointer; color: #665c54; padding: 0 4px; }
.rm:hover { color: #fb4934; }
#pinsearch { background: #282828; margin-top: 10px; }
.cand { cursor: pointer; padding: 3px 6px; border-radius: 3px; color: #a89984; font-family: monospace; font-size: 13px; }
.cand:hover { background: #3c3836; color: #ebdbb2; }
#strip, #pinbox, #tables > div, textarea { scrollbar-width: thin; scrollbar-color: #504945 transparent; }
#tip { position: fixed; background: #1d2021; border: 1px solid #504945; border-radius: 4px; padding: 5px 10px; font-family: monospace; font-size: 12px; pointer-events: none; z-index: 10; white-space: pre; }
</style>

<div class="banner">lens viewer <span id="status"></span></div>
<div class="panes">
    <div id="strip"></div>
    <div id="right">
        <div id="toprow">
            <div id="pinbox">
                <div class="label">pins <span class="hint">click a table row or search below</span></div>
                <div id="pinlist"></div>
                <input id="pinsearch" placeholder="search templates / tokenize text" oninput="search()">
                <div id="pincands"></div>
            </div>
            <div id="inputcol">
                <input id="tag" placeholder="model/run/idx from the rollout viewer, enter to load text (not run)" onkeydown="if (event.key == 'Enter') loadTag()">
                <textarea id="text" placeholder="raw prompt text (already templated); paste a record tag above to fill"></textarea>
                <div class="controls">
                    <button onclick="run()">run</button>
                    <span class="label">k</span> <input id="k" type="number" value="15">
                </div>
            </div>
        </div>
        <div id="layerbox" hidden><span class="label">layer</span> <input id="layer" type="range" oninput="render()"> <b id="layerval"></b> <span class="label">bars</span> <select id="mode" onchange="localStorage.setItem('mode', this.value); render()"><option value="abs">absolute (prob / cos)</option><option value="norm">normalized over positions</option><option value="ratio">ratio to top item</option></select></div>
        <div id="tables"></div>
    </div>
</div>
<div id="tip" hidden></div>

<script>
let data = null, pos = 0, words = [], pinData = [], cands = [];
const palette = ["#fb4934", "#83a598", "#b8bb26", "#d3869b", "#fe8019", "#8ec07c", "#fabd2f", "#928374"];
const $ = id => document.getElementById(id);
let pins = JSON.parse(localStorage.getItem("pins") || "[]");
$("text").value = localStorage.getItem("text") || "";
$("tag").value = localStorage.getItem("tag") || "";
$("mode").value = localStorage.getItem("mode") || "norm";
$("text").oninput = () => localStorage.setItem("text", $("text").value);
fetch("/words").then(r => r.json()).then(w => { words = w; });
renderPinList();

function esc(s) { return s.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll('"', "&quot;"); }
function savePins() { localStorage.setItem("pins", JSON.stringify(pins)); }
async function post(url, body) {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) {
        $("status").textContent = `${url} failed: ${r.status}`;
        throw new Error(await r.text());
    }
    return r.json();
}

// ---- record tag ----
async function loadTag() {
    const tag = $("tag").value.trim();
    localStorage.setItem("tag", tag);
    $("status").textContent = "templating...";
    const res = await (await fetch("/text/" + tag)).json();
    $("text").value = res.text;
    localStorage.setItem("text", res.text);
    $("status").textContent = "loaded, edit then run";
}

// ---- lens ----
async function run() {
    $("status").textContent = "running...";
    data = await post("/run", { text: $("text").value, k: +$("k").value });
    $("status").textContent = `${data.toks.length} tokens`;
    const slider = $("layer");
    slider.min = data.layers[0];
    slider.max = data.layers[data.layers.length - 1];
    $("layerbox").hidden = false;
    pos = data.toks.length - 1;
    renderStrip();
    await fetchPins();
    render();
}

async function fetchPins() {
    if (!pins.length || !data) { pinData = []; return; }
    pinData = (await post("/pins", { pins: pins.map(p => ({ kind: p.kind, id: p.id })) })).pins;
}

function addPin(kind, id, label) {
    pins.push({ kind, id, label, color: palette[pins.length % palette.length], on: true });
    savePins();
    renderPinList();
    fetchPins().then(render);
}
function removePin(i) { pins.splice(i, 1); pinData.splice(i, 1); savePins(); renderPinList(); render(); }
function togglePin(i, on) { pins[i].on = on; savePins(); render(); }

function renderPinList() {
    $("pinlist").innerHTML = pins.map((p, i) => `
        <div class="pin">
            <input type="checkbox" ${p.on ? "checked" : ""} onchange="togglePin(${i}, this.checked)">
            <span class="swatch" style="background:${p.color}"></span>
            <span class="plabel"><span class="kind">${p.kind}</span> ${esc(JSON.stringify(p.label))}</span>
            <span class="rm" onclick="removePin(${i})">✕</span>
        </div>`).join("");
}

async function search() {
    const q = $("pinsearch").value;
    if (!q) { cands = []; $("pincands").innerHTML = ""; return; }
    const enc = await post("/encode", { text: q });
    const tmpl = words.map((w, i) => [i, w]).filter(([i, w]) => w.toLowerCase().includes(q.toLowerCase())).slice(0, 15);
    cands = enc.ids.map((id, j) => ({ kind: "tok", id, label: enc.toks[j] })).concat(tmpl.map(([i, w]) => ({ kind: "tmpl", id: i, label: w })));
    $("pincands").innerHTML = cands.map((c, i) => `<div class="cand" onclick="addPin(cands[${i}].kind, cands[${i}].id, cands[${i}].label)"><span class="kind">${c.kind}</span> ${esc(JSON.stringify(c.label))}</div>`).join("");
}

function renderStrip() {
    const strip = $("strip");
    strip.innerHTML = "";
    data.toks.forEach((tok, i) => {
        const d = document.createElement("div");
        d.className = "tok" + (i % 2 ? " alt" : "");
        const txt = document.createElement("span");
        txt.className = "txt";
        txt.textContent = tok.replaceAll("\n", "⏎");
        d.appendChild(txt);
        d.onclick = () => { pos = i; render(); };
        d.onmouseenter = () => showTip(i, d);
        d.onmouseleave = () => $("tip").hidden = true;
        strip.appendChild(d);
        for (let j = 0; j < tok.split("\n").length - 1; j++) strip.appendChild(document.createElement("br"));
    });
}

function showTip(i, d) {
    const layer = +$("layer").value;
    const lines = pins.map((p, j) => (p.on && pinData[j]) ? `<div style="color:${p.color}">${esc(JSON.stringify(p.label))}  ${pinData[j].val[layer][i]}  r${pinData[j].rank[layer][i]}</div>` : "").join("");
    if (!lines) return;
    const tip = $("tip");
    tip.innerHTML = lines;
    tip.hidden = false;
    const r = d.getBoundingClientRect();
    tip.style.left = r.left + "px";
    tip.style.top = r.bottom + 4 + "px";
}

function table(name, cls, where, headers, rows, kind, pinnedRows) {
    const pinById = Object.fromEntries(pinnedRows.map(([p]) => [p.id, p]));
    const cells = rows.map((r, i) => `<tr class="pinnable${pinById[r[0]] ? " pinned" : ""}"${pinById[r[0]] ? ` style="color:${pinById[r[0]].color}"` : ""} data-kind="${kind}" data-id="${r[0]}" data-label="${esc(JSON.stringify(r[1]))}"><td>${i}</td><td>${esc(JSON.stringify(r[1]))}</td>${r.slice(2).map(c => `<td>${c}</td>`).join("")}</tr>`).join("");
    const pcells = pinnedRows.filter(([p]) => !rows.some(r => r[0] == p.id)).map(([p, rank, ...vals]) => `<tr class="pinned" style="color:${p.color}"><td>${rank}</td><td>${esc(JSON.stringify(p.label))}</td>${vals.map(v => `<td>${v}</td>`).join("")}</tr>`).join("");
    const cols = `<colgroup><col style="width:58px"><col>${headers.slice(1).map(() => '<col style="width:92px">').join("")}</colgroup>`;
    return `<div><div class="label"><span class="${cls}">${name}</span> <span class="where">${where}</span></div><table>${cols}<tr>${["#", ...headers].map(h => `<th>${h}</th>`).join("")}</tr>${cells}${pcells}</table></div>`;
}

function render() {
    if (!data) return;
    const layer = +$("layer").value;
    $("layerval").textContent = layer;
    const mode = $("mode").value;
    const norms = pins.map((p, j) => {
        if (!p.on || !pinData[j]) return null;
        const tok = p.kind == "tok", vals = pinData[j].val[layer], mag = tok ? pinData[j].prob[layer] : vals;
        if (mode == "abs") return mag.map(v => Math.max(0, v));
        if (mode == "ratio") return mag.map((v, i) => Math.max(0, v / (tok ? data.jlens[layer][i][0][3] : data.tlens[layer][i][0][2])));
        const mn = Math.min(...vals), mx = Math.max(...vals);
        return vals.map(v => mx > mn ? (v - mn) / (mx - mn) : 0);
    });
    document.querySelectorAll("#strip .tok").forEach((d, i) => {
        d.classList.toggle("sel", i == pos);
        d.querySelectorAll(".bar").forEach(b => b.remove());
        pins.forEach((p, j) => {
            if (!norms[j]) return;
            const bar = document.createElement("div");
            bar.className = "bar";
            bar.style.background = p.color;
            bar.style.opacity = norms[j][i];
            d.appendChild(bar);
        });
    });
    const jPinned = [], tPinned = [];
    pins.forEach((p, j) => {
        const pd = pinData[j];
        if (!p.on || !pd) return;
        if (p.kind == "tok") jPinned.push([p, pd.rank[layer][pos], pd.val[layer][pos], pd.prob[layer][pos]]);
        else tPinned.push([p, pd.rank[layer][pos], pd.val[layer][pos]]);
    });
    const where = `L${layer} · pos ${pos} ${esc(JSON.stringify(data.toks[pos]))}`;
    $("tables").innerHTML =
        table("jlens", "lj", where, ["Tok", "Logit", "Prob"], data.jlens[layer][pos], "tok", jPinned) +
        table("tlens", "lt", where, ["Template", "Cos"], data.tlens[layer][pos], "tmpl", tPinned);
}

$("tables").onclick = e => {
    const tr = e.target.closest("tr.pinnable");
    if (tr) addPin(tr.dataset.kind, +tr.dataset.id, JSON.parse(tr.dataset.label));
};
document.onkeydown = e => {
    const el = e.target;
    if (!data || el.tagName == "TEXTAREA" || el.tagName == "SELECT" || (el.tagName == "INPUT" && el.type != "range" && el.type != "checkbox")) return;
    if (e.key == "ArrowLeft" || e.key == "ArrowRight") {
        const s = $("layer");
        s.value = +s.value + (e.key == "ArrowRight" ? 1 : -1);
        e.preventDefault();
        render();
    }
};
</script>
